<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayas Kitchen Admin</title><style>body{font-family:Arial;background:#f5ead5;margin:0;color:#27160f}.wrap{max-width:1000px;width:94%;margin:30px auto}.box{background:#fffdf8;padding:22px;border-radius:18px;margin-bottom:18px;box-shadow:0 10px 30px #0001}h1,h2{color:#6e1018}input{padding:13px;border:1px solid #d6bf91;border-radius:10px}button{padding:11px 15px;border:0;border-radius:9px;background:#6e1018;color:white;font-weight:bold;margin:4px}.danger{background:#9a1f27}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#f5e6c5;padding:14px;border-radius:12px}.table{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}.hidden{display:none}</style></head><body><main class="wrap"><div class="box" id="login"><h1>Bayas Kitchen • Admin</h1><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">Login</button><p id="err"></p></div><div id="panel" class="hidden"><div class="box"><h1>Raffle Dashboard</h1><div class="stats"><div class="stat">Tickets issued: <b id="count">0</b></div><div class="stat">Next ticket: <b id="next">#0001</b></div></div><button onclick="load()">Refresh</button><button onclick="logout()">Logout</button><button class="danger" onclick="resetDraw()">Reset draw</button></div><div class="box"><h2>Issued Tickets</h2><div class="table"><table><thead><tr><th>Number</th><th>Name</th><th>Phone</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main><script>let token=localStorage.getItem("bk_admin")||"";async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw.value})}),d=await r.json();if(!d.ok)return err.textContent=d.error;token=d.token;localStorage.setItem("bk_admin",token);show();load()}function show(){loginEl.classList.add("hidden");panel.classList.remove("hidden")}let loginEl=document.getElementById("login"),panel=document.getElementById("panel");async function load(){let r=await fetch("/api/admin/tickets",{headers:{Authorization:"Bearer "+token}});if(r.status===401)return logout();let d=await r.json();count.textContent=d.tickets.length;next.textContent="#"+String(d.nextNumber).padStart(4,"0");rows.innerHTML=d.tickets.map(t=>`<tr><td><b>${t.number}</b></td><td>${esc(t.name)}</td><td>${esc(t.phone)}</td><td>${new Date(t.claimedAt).toLocaleString()}</td></tr>`).join("")}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}async function resetDraw(){if(!confirm("Delete all tickets and restart at #0001?"))return;await fetch("/api/admin/reset",{method:"POST",headers:{Authorization:"Bearer "+token}});load()}async function logout(){await fetch("/api/admin/logout",{method:"POST",headers:{Authorization:"Bearer "+token}}).catch(()=>{});localStorage.removeItem("bk_admin");location.reload()}if(token){show();load()}</script></body></html>
